<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 9º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho">
    <div class="container">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">9º Ano — Ensino Fundamental | Estudante Exemplo</p>
    </div>
  </header>

  <main class="container">
    <!-- Seção de Cards de Resumo -->
    <section class="cards-grid">
      <div class="card">
        <h3>Média Geral</h3>
        <p class="card-valor" id="card-media-geral">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p class="card-valor" id="card-total-faltas">—</p>
      </div>

      <div class="card card-sucesso">
        <h3>Bom Desempenho</h3>
        <p class="card-valor" id="card-bom-desempenho">—</p>
      </div>

      <div class="card card-atencao">
        <h3>Precisa de Atenção</h3>
        <p class="card-valor" id="card-precisa-atencao">—</p>
      </div>

      <div class="card card-destaque">
        <h3>Frequência Geral</h3>
        <p class="card-valor">92%</p>
        <span class="card-legenda">Frequência adequada</span>
      </div>
    </section>

    <!-- Seção da Tabela do Boletim -->
    <section class="tabela-container">
      <h2>Disciplinas e Notas</h2>
      <div class="tabela-scroll">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As 15 disciplinas serão inseridas dinamicamente pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
